<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>QR Code Generator — Shazeeda's Brews &amp; Bites</title>
  <link rel="icon" href="assets/logo.jpeg" />
  <link rel="stylesheet" href="css/qr.css" />
</head>
<body>
  <div class="wrap">
    <h1>Menu QR Code</h1>
    <p class="sub">Generate the QR code once, after the menu is live. It points at the page URL and never needs to change — only the menu content does.</p>

    <label for="url">Live menu URL</label>
    <input id="url" type="url" placeholder="https://shazeedas-brews-bites-menu.pages.dev" />
    <button id="gen" type="button">Generate QR code</button>
    <button id="dl" type="button" class="secondary" hidden>Download PNG</button>

    <div id="qrbox"></div>
    <p class="hint">Tip: print it large and crisp. Test it with a phone camera before putting it on a table or window.</p>
  </div>

  <!-- QR library is self-hosted (js/vendor) so the site's strict CSP applies
       here too — no CDN, no inline scripts. -->
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
